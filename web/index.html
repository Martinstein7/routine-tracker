<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Routine Tracker</title>
    <script>
      // Aplica o tema salvo antes de desenhar a página, para não piscar o tema claro (ver src/lib/theme.tsx).
      try {
        var saved = JSON.parse(localStorage.getItem('rt-theme') || 'null')
        var mode = (saved && saved.mode) || 'system'
        var theme = mode === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : mode
        document.documentElement.dataset.theme = theme
        var vars = (saved && saved.vars && saved.vars[theme]) || {}
        for (var name in vars) document.documentElement.style.setProperty(name, vars[name])
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
