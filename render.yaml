# Render (plano gratuito) + banco PostgreSQL no Neon. Ver "Publicar na nuvem" no README.
services:
  - type: web
    name: routine-tracker
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # Connection string do Neon (a "direct", sem "-pooler" no endereço). Preenchida na criação.
      - key: DATABASE_URL
        sync: false
      - key: EMBEDDED_DB
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: "true"
